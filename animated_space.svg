<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <rect width="1200" height="400" fill="#090014"/>

  <!-- Estrella lila que titila -->
  <circle cx="200" cy="150" r="3" fill="#C9B6FF">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Estrella aguamarina -->
  <circle cx="600" cy="250" r="3" fill="#A8F0E5"/>

  <!-- Estrella lila clara -->
  <circle cx="950" cy="100" r="3" fill="#E6D9FF"/>

  <!-- Estrella fugaz diagonal -->
  <circle cx="0" cy="80" r="3" fill="#A8F0E5">
    <animate
      attributeName="cx"
      values="0;1200"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="cy"
      values="80;350"
      dur="4s"
      repeatCount="indefinite"/>
  </circle>

</svg>
